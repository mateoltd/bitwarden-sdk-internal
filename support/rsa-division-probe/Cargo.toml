[package]
name = "rsa-division-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
original-bigint = { package = "crypto-bigint", version = "=0.7.5", default-features = false, features = ["alloc", "zeroize"] }
candidate-bigint = { package = "crypto-bigint", path = "../vendor/crypto-bigint", default-features = false, features = ["alloc", "zeroize"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[profile.speed]
inherits = "release"
opt-level = 3
