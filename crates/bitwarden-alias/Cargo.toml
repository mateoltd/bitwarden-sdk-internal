[package]
name = "bitwarden-alias"
description = "GPL-only alias lifecycle support for the Bitwarden SDK."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license = "GPL-3.0-only"
readme = "README.md"
keywords.workspace = true

[features]
default = []
uniffi = ["bitwarden-sensitive-value/uniffi", "dep:uniffi"]
wasm = [
    "bitwarden-core/wasm",
    "bitwarden-sensitive-value/wasm",
    "dep:js-sys",
    "dep:tsify",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
bitwarden-api-base = { workspace = true }
bitwarden-core = { workspace = true }
bitwarden-sensitive-value = { workspace = true }
bitwarden-vault = { workspace = true }
http = { workspace = true }
js-sys = { workspace = true, optional = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tsify = { workspace = true, optional = true }
uniffi = { workspace = true, optional = true, features = ["tokio"] }
url = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { version = "0.3.91", optional = true, features = [
    "AbortController",
    "AbortSignal",
    "Headers",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Response",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }

[lints]
workspace = true
