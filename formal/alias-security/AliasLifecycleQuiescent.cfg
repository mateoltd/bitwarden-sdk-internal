SPECIFICATION ReliableQuiescentSpec

CONSTANTS
    Connections = {connectionA, connectionB}
    AliasIds = {alias1, alias2}
    Actors = {actor1}
    MaxAttempts = 3
    NoValue = noValue

INVARIANTS
    TypeOK
    StableMutationTarget
    AuthorizedMutations
    SuccessRequiresVerifiedRead
    ReplayedResponseIgnored
    UnknownOutcomeNotReplayed
    DeleteDispatchedAtMostOnce
