SPECIFICATION Spec

CONSTANTS
    Connections = {connectionA, connectionB}
    ActiveConnection = connectionA
    ForeignConnection = connectionB
    AliasIds = {opaqueAlias}
    Devices = {deviceA, deviceB}
    MaxClock = 2

INVARIANTS
    TypeOK
    AppendOnly
    ConnectionScoped
    CausalIdentifiersUnique
    CausalParentsExist
    MergeCommutative
    MergeAssociative
    MergeIdempotent
    DeterministicReduction
    TombstonesPreventResurrection
    ConcurrentConflictsRemainExplicit
    UnknownOutcomesRemainExplicit

CHECK_DEADLOCK FALSE
