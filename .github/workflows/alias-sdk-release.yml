name: Alias SDK release candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/alias-sdk-*.yml"
      - ".gitleaks.toml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Cross.toml"
      - "crates/bitwarden-alias/**"
      - "crates/bitwarden-generators/**"
      - "crates/bitwarden-uniffi/**"
      - "crates/bitwarden-wasm-internal/**"
      - "formal/alias-security/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/alias-sdk/**"
      - "scripts/check-oss-artifact-boundary.sh"
      - "support/alias-sdk-release/**"
      - "support/simplelogin/**"
  push:
    branches:
      - "main"
      - "integration/public-alias-sdk"
      - "refactor/provider-neutral-alias-v1"

permissions:
  contents: read

concurrency:
  group: alias-sdk-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: Policy and consolidated security contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.96.0"

      - name: Install Java for TLA+
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: alias-release-policy

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Verify external source pins
        run: scripts/alias-sdk/check-external-pins.sh

      - name: Install checksum-pinned Gitleaks
        run: scripts/alias-sdk/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"

      - name: Scan alias patch history for secrets
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
        run: scripts/alias-sdk/scan-secrets.sh

      - name: Verify commercial boundary
        run: scripts/check-oss-artifact-boundary.sh

      - name: Test authoritative alias security contract
        run: scripts/alias-sdk/check-security-contract.sh

  assurance:
    name: Dependency audit evidence
    runs-on: ubuntu-24.04
    needs: policy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.96.0"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"
          cache: npm

      - name: Install pinned Cargo audit tool
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit locked Rust and JavaScript graphs
        run: |
          mkdir -p "$RUNNER_TEMP/alias-sdk-assurance"
          scripts/alias-sdk/create-cargo-package-list.sh "$RUNNER_TEMP/cargo-active.txt"
          set +e
          cargo audit --json >"$RUNNER_TEMP/cargo-audit.json"
          cargo_audit_exit=$?
          npm audit --json >"$RUNNER_TEMP/npm-audit.json"
          npm_audit_exit=$?
          set -e
          printf 'cargo-audit-exit=%s\nnpm-audit-exit=%s\n' \
            "$cargo_audit_exit" "$npm_audit_exit" \
            >"$RUNNER_TEMP/alias-sdk-assurance/AUDIT-TOOL-STATUS.txt"
          scripts/alias-sdk/create-audit-report.mjs \
            "$RUNNER_TEMP/cargo-audit.json" \
            "$RUNNER_TEMP/npm-audit.json" \
            "$RUNNER_TEMP/cargo-active.txt" \
            "support/alias-sdk-release/audit-policy.json" \
            "$RUNNER_TEMP/alias-sdk-assurance/AUDIT-REPORT.json"

      - name: Upload dependency audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-sdk-assurance
          path: ${{ runner.temp }}/alias-sdk-assurance
          if-no-files-found: error
          retention-days: 30

  wasm:
    name: TypeScript and WASM clean room
    runs-on: ubuntu-24.04
    needs: policy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"
          cache: npm

      - name: Install locked JavaScript build tools
        run: npm ci --ignore-scripts

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache Cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: alias-release-wasm

      - name: Build release package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/wasm-target-first
        run: scripts/alias-sdk/build-wasm.sh "$RUNNER_TEMP/alias-sdk-typescript"

      - name: Rebuild and verify normalized package bytes
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/wasm-target-second
        run: |
          scripts/alias-sdk/build-wasm.sh "$RUNNER_TEMP/alias-sdk-typescript-rebuild"
          scripts/alias-sdk/verify-reproducible.sh \
            "$RUNNER_TEMP/alias-sdk-typescript" \
            "$RUNNER_TEMP/alias-sdk-typescript-rebuild" \
            >"$RUNNER_TEMP/alias-sdk-typescript-reproducibility.txt"
          mv "$RUNNER_TEMP/alias-sdk-typescript-reproducibility.txt" \
            "$RUNNER_TEMP/alias-sdk-typescript/REPRODUCIBILITY.txt"

      - name: Test WASM runtime conformance
        run: scripts/alias-sdk/test-wasm-conformance.sh

      - name: Test bitwarden-clients-compatible consumer
        run: |
          package="$(find "$RUNNER_TEMP/alias-sdk-typescript" -maxdepth 1 -name '*.tgz' -print -quit)"
          scripts/alias-sdk/test-consumer.sh typescript "$package"

      - name: Generate TypeScript API report
        run: |
          package="$(find "$RUNNER_TEMP/alias-sdk-typescript" -maxdepth 1 -name '*.tgz' -print -quit)"
          scripts/alias-sdk/create-api-report.sh typescript "$package" \
            "$RUNNER_TEMP/alias-sdk-typescript/API-REPORT.txt"

      - name: Record build environment
        run: |
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            node --version
            npm --version
            rustc --version
            ./node_modules/.bin/wasm-opt --version
          } >"$RUNNER_TEMP/alias-sdk-typescript/BUILD-ENVIRONMENT.txt"

      - name: Upload TypeScript artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-sdk-typescript
          path: ${{ runner.temp }}/alias-sdk-typescript
          if-no-files-found: error
          retention-days: 30

  swift:
    name: Swift clean room
    runs-on: macos-14
    needs: policy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust with iOS targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.96.0"
          targets: aarch64-apple-ios-sim,aarch64-apple-ios,x86_64-apple-ios

      - name: Cache Cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: alias-release-swift

      - name: Build release package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/swift-target
        run: scripts/alias-sdk/build-swift.sh "$RUNNER_TEMP/alias-sdk-swift"

      - name: Rebuild and verify normalized package bytes
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/swift-target
        run: |
          cargo clean --target-dir "$CARGO_TARGET_DIR"
          scripts/alias-sdk/build-swift.sh "$RUNNER_TEMP/alias-sdk-swift-rebuild"
          scripts/alias-sdk/verify-reproducible.sh \
            "$RUNNER_TEMP/alias-sdk-swift" \
            "$RUNNER_TEMP/alias-sdk-swift-rebuild" \
            >"$RUNNER_TEMP/alias-sdk-swift-reproducibility.txt"
          mv "$RUNNER_TEMP/alias-sdk-swift-reproducibility.txt" \
            "$RUNNER_TEMP/alias-sdk-swift/REPRODUCIBILITY.txt"

      - name: Upload Swift reproducibility diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-swift-repro-diagnostic
          path: |
            ${{ runner.temp }}/alias-sdk-swift
            ${{ runner.temp }}/alias-sdk-swift-rebuild
          if-no-files-found: error
          retention-days: 1

      - name: Test clean-room package consumer
        run: |
          package="$(find "$RUNNER_TEMP/alias-sdk-swift" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          scripts/alias-sdk/test-consumer.sh swift "$package"

      - name: Generate Swift API report
        run: |
          package="$(find "$RUNNER_TEMP/alias-sdk-swift" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          scripts/alias-sdk/create-api-report.sh swift "$package" \
            "$RUNNER_TEMP/alias-sdk-swift/API-REPORT.txt"

      - name: Record build environment
        run: |
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            rustc --version
            swift --version
            xcodebuild -version
          } >"$RUNNER_TEMP/alias-sdk-swift/BUILD-ENVIRONMENT.txt"

      - name: Upload Swift artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-sdk-swift
          path: ${{ runner.temp }}/alias-sdk-swift
          if-no-files-found: error
          retention-days: 30

  kotlin:
    name: Kotlin JVM clean room
    runs-on: ubuntu-24.04
    needs: policy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17.0.14+7"
          cache: gradle

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: alias-release-kotlin

      - name: Build host package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/kotlin-target-first
        run: scripts/alias-sdk/build-kotlin-host.sh "$RUNNER_TEMP/alias-sdk-kotlin"

      - name: Rebuild and verify normalized package bytes
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/kotlin-target-second
        run: |
          scripts/alias-sdk/build-kotlin-host.sh "$RUNNER_TEMP/alias-sdk-kotlin-rebuild"
          scripts/alias-sdk/verify-reproducible.sh \
            "$RUNNER_TEMP/alias-sdk-kotlin" \
            "$RUNNER_TEMP/alias-sdk-kotlin-rebuild" \
            >"$RUNNER_TEMP/alias-sdk-kotlin-reproducibility.txt"
          mv "$RUNNER_TEMP/alias-sdk-kotlin-reproducibility.txt" \
            "$RUNNER_TEMP/alias-sdk-kotlin/REPRODUCIBILITY.txt"

      - name: Test clean-room JVM consumer
        run: scripts/alias-sdk/test-consumer.sh kotlin "$RUNNER_TEMP/alias-sdk-kotlin"

      - name: Generate Kotlin API report
        run: |
          package="$(find "$RUNNER_TEMP/alias-sdk-kotlin" -maxdepth 1 -name '*.jar' -print -quit)"
          scripts/alias-sdk/create-api-report.sh kotlin "$package" \
            "$RUNNER_TEMP/alias-sdk-kotlin/API-REPORT.txt"

      - name: Record build environment
        run: |
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            rustc --version
            java -version 2>&1
          } >"$RUNNER_TEMP/alias-sdk-kotlin/BUILD-ENVIRONMENT.txt"

      - name: Upload Kotlin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-sdk-kotlin
          path: ${{ runner.temp }}/alias-sdk-kotlin
          if-no-files-found: error
          retention-days: 30

  android-native:
    name: Android native ${{ matrix.target }}
    runs-on: ubuntu-24.04
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: x86_64-linux-android
            abi: x86_64
          - target: i686-linux-android
            abi: x86
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: alias-release-${{ matrix.target }}

      - name: Install pinned cargo runner
        run: cargo install cargo-run-bin --locked --version 1.7.4

      - name: Verify cargo tool provenance
        run: scripts/check-no-binstall.sh

      - name: Initialize pinned cargo runner
        run: cargo bin cross --version

      - name: Build native library
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/android-target
          TARGET: ${{ matrix.target }}
        run: cargo bin cross build --locked --package bitwarden-uniffi --release --target="$TARGET"

      - name: Stage native library and verify a clean rebuild
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-native/$ABI"
          cp "$RUNNER_TEMP/android-target/$TARGET/release/libbitwarden_uniffi.so" \
            "$RUNNER_TEMP/android-native/$ABI/"
          cargo clean --target-dir "$RUNNER_TEMP/android-target"
          CARGO_TARGET_DIR="$RUNNER_TEMP/android-target" \
            cargo bin cross build --locked --package bitwarden-uniffi --release --target="$TARGET"
          scripts/alias-sdk/verify-reproducible.sh \
            "$RUNNER_TEMP/android-native/$ABI/libbitwarden_uniffi.so" \
            "$RUNNER_TEMP/android-target/$TARGET/release/libbitwarden_uniffi.so" \
            >"$RUNNER_TEMP/android-native/$ABI/REPRODUCIBILITY.txt"

      - name: Upload Android reproducibility diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-android-repro-diagnostic-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/android-native/${{ matrix.abi }}/libbitwarden_uniffi.so
            ${{ runner.temp }}/android-target/${{ matrix.target }}/release/libbitwarden_uniffi.so
          if-no-files-found: error
          retention-days: 1

      - name: Upload native library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-android-native-${{ matrix.abi }}
          path: ${{ runner.temp }}/android-native
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android AAR clean room
    runs-on: ubuntu-24.04
    needs: android-native
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17.0.14+7"
          cache: gradle

      - name: Setup Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          cmdline-tools-version: "12266719"
          packages: ""

      - name: Install pinned Android SDK and NDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >>"$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >>"$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: alias-release-android-combine

      - name: Download native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: alias-android-native-*
          path: ${{ runner.temp }}/android-native
          merge-multiple: true

      - name: Assemble AAR
        run: |
          jni="crates/bitwarden-uniffi/kotlin/sdk/src/main/jniLibs"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "$jni/$abi"
            cp "$RUNNER_TEMP/android-native/$abi/libbitwarden_uniffi.so" "$jni/$abi/"
          done
          (
            cd crates/bitwarden-uniffi/kotlin
            ./build-schemas.sh
            ../../../scripts/alias-sdk/retry-command.sh 3 20 \
              ./gradlew --no-daemon :sdk:assembleRelease
          )

      - name: Stage normalized Android artifact
        run: |
          release_version="$(scripts/alias-sdk/read-release-version.sh)"
          mkdir -p "$RUNNER_TEMP/alias-sdk-android"
          cp crates/bitwarden-uniffi/kotlin/sdk/build/outputs/aar/sdk-release.aar \
            "$RUNNER_TEMP/alias-sdk-android/bitwarden-alias-sdk-android-${release_version}.aar"
          scripts/alias-sdk/normalize-archive.sh zip \
            "$RUNNER_TEMP/alias-sdk-android/bitwarden-alias-sdk-android-${release_version}.aar"
          git rev-parse HEAD >"$RUNNER_TEMP/alias-sdk-android/VERSION"
          printf '%s\n' "$release_version" >"$RUNNER_TEMP/alias-sdk-android/PACKAGE_VERSION"
          cp support/alias-sdk-release/ALIAS_REFERENCE_SCHEMA_VERSION \
            "$RUNNER_TEMP/alias-sdk-android/ALIAS_REFERENCE_SCHEMA_VERSION"
          {
            for abi in arm64-v8a armeabi-v7a x86_64 x86; do
              echo "abi=$abi"
              sed 's/^/  /' "$RUNNER_TEMP/android-native/$abi/REPRODUCIBILITY.txt"
            done
          } >"$RUNNER_TEMP/alias-sdk-android/NATIVE-REPRODUCIBILITY.txt"

      - name: Rebuild and verify normalized AAR bytes
        run: |
          release_version="$(scripts/alias-sdk/read-release-version.sh)"
          (
            cd crates/bitwarden-uniffi/kotlin
            ../../../scripts/alias-sdk/retry-command.sh 3 20 \
              ./gradlew --no-daemon :sdk:clean :sdk:assembleRelease
          )
          mkdir -p "$RUNNER_TEMP/alias-sdk-android-rebuild"
          cp crates/bitwarden-uniffi/kotlin/sdk/build/outputs/aar/sdk-release.aar \
            "$RUNNER_TEMP/alias-sdk-android-rebuild/bitwarden-alias-sdk-android-${release_version}.aar"
          scripts/alias-sdk/normalize-archive.sh zip \
            "$RUNNER_TEMP/alias-sdk-android-rebuild/bitwarden-alias-sdk-android-${release_version}.aar"
          cp "$RUNNER_TEMP/alias-sdk-android/VERSION" "$RUNNER_TEMP/alias-sdk-android-rebuild/"
          cp "$RUNNER_TEMP/alias-sdk-android/PACKAGE_VERSION" "$RUNNER_TEMP/alias-sdk-android-rebuild/"
          cp "$RUNNER_TEMP/alias-sdk-android/ALIAS_REFERENCE_SCHEMA_VERSION" \
            "$RUNNER_TEMP/alias-sdk-android-rebuild/"
          cp "$RUNNER_TEMP/alias-sdk-android/NATIVE-REPRODUCIBILITY.txt" \
            "$RUNNER_TEMP/alias-sdk-android-rebuild/"
          scripts/alias-sdk/verify-reproducible.sh \
            "$RUNNER_TEMP/alias-sdk-android" \
            "$RUNNER_TEMP/alias-sdk-android-rebuild" \
            >"$RUNNER_TEMP/alias-sdk-android-reproducibility.txt"
          mv "$RUNNER_TEMP/alias-sdk-android-reproducibility.txt" \
            "$RUNNER_TEMP/alias-sdk-android/REPRODUCIBILITY.txt"

      - name: Verify and test packaged AAR
        run: |
          aar="$(find "$RUNNER_TEMP/alias-sdk-android" -maxdepth 1 -name '*.aar' -print -quit)"
          scripts/check-oss-artifact-boundary.sh --kotlin "$aar"
          scripts/alias-sdk/test-consumer.sh android "$aar"

      - name: Generate Android API report and environment
        run: |
          aar="$(find "$RUNNER_TEMP/alias-sdk-android" -maxdepth 1 -name '*.aar' -print -quit)"
          scripts/alias-sdk/create-api-report.sh android "$aar" \
            "$RUNNER_TEMP/alias-sdk-android/API-REPORT.txt"
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "runner_image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            rustc --version
            java -version 2>&1
            sdkmanager --version
          } >"$RUNNER_TEMP/alias-sdk-android/BUILD-ENVIRONMENT.txt"

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-sdk-android
          path: ${{ runner.temp }}/alias-sdk-android
          if-no-files-found: error
          retention-days: 30

  simplelogin:
    name: Pinned real SimpleLogin lifecycle
    runs-on: ubuntu-24.04
    needs: policy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.96.0"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          key: alias-release-simplelogin

      - name: Run pinned provider lifecycle
        run: support/simplelogin/lab.sh test

      - name: Clean up provider lab
        if: always()
        run: support/simplelogin/lab.sh down || true

  bundle:
    name: Assemble checksummed candidate
    runs-on: ubuntu-24.04
    needs: [assurance, wasm, swift, kotlin, android, simplelogin]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout manifest inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.17.0"

      - name: Install Rust for locked dependency metadata
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.96.0"

      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: alias-sdk-*
          path: ${{ runner.temp }}/candidate/artifacts

      - name: Create deterministic public dependency SBOM
        run: |
          cargo metadata --locked --format-version 1 >"$RUNNER_TEMP/cargo-metadata.json"
          scripts/alias-sdk/create-cargo-package-list.sh "$RUNNER_TEMP/cargo-active.txt"
          scripts/alias-sdk/create-sbom.mjs \
            "$RUNNER_TEMP/candidate/artifacts" \
            "$RUNNER_TEMP/cargo-metadata.json" \
            "$RUNNER_TEMP/cargo-active.txt" \
            "${{ github.workspace }}/package-lock.json" \
            "$RUNNER_TEMP/candidate-sbom.json"

      - name: Create release manifest
        env:
          CLIENTS_CONTRACT_FILE: ${{ github.workspace }}/support/alias-sdk-release/consumers/typescript/bitwarden-clients-contract.json
          CLIENT_INTEGRATION_FILE: ${{ github.workspace }}/support/alias-sdk-release/client-integration.json
          CONFORMANCE_VECTORS_FILE: ${{ github.workspace }}/formal/alias-security/conformance-vectors.json
          ALIAS_REFERENCE_SCHEMA_VERSION_FILE: ${{ github.workspace }}/support/alias-sdk-release/ALIAS_REFERENCE_SCHEMA_VERSION
          INTEGRATION_BASE_FILE: ${{ github.workspace }}/support/alias-sdk-release/INTEGRATION_BASE
          IOS_INTEGRATION_FILE: ${{ github.workspace }}/support/alias-sdk-release/ios-integration.json
          PREVIOUS_PUBLIC_ALIAS_HEAD_FILE: ${{ github.workspace }}/support/alias-sdk-release/PREVIOUS_PUBLIC_ALIAS_HEAD
          PROVIDER_PIN_FILE: ${{ github.workspace }}/support/simplelogin/SIMPLELOGIN_COMMIT
          RELEASE_VERSION_FILE: ${{ github.workspace }}/support/alias-sdk-release/VERSION
          SBOM_FILE: ${{ runner.temp }}/candidate-sbom.json
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          KEYLESS_ATTESTATION_EXPECTED: ${{ github.event_name != 'pull_request' }}
          TYPESCRIPT_PACKAGE_FILE: ${{ github.workspace }}/crates/bitwarden-wasm-internal/npm/package.json
          UPSTREAM_BASE_FILE: ${{ github.workspace }}/support/alias-sdk-release/UPSTREAM_BASE
        run: |
          scripts/alias-sdk/create-release-manifest.mjs \
            "$RUNNER_TEMP/candidate/artifacts" \
            "$RUNNER_TEMP/candidate"

      - name: Verify handoff manifest checksums
        working-directory: ${{ runner.temp }}/candidate
        run: sha256sum --check SHA256SUMS

      - name: Verify candidate evidence boundary
        run: scripts/alias-sdk/check-candidate-evidence.sh "$RUNNER_TEMP/candidate"

      - name: Create keyless candidate provenance
        if: github.event_name != 'pull_request'
        id: provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ runner.temp }}/candidate/**

      - name: Include the signed provenance bundle
        if: github.event_name != 'pull_request'
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$PROVENANCE_BUNDLE" "$RUNNER_TEMP/candidate/PROVENANCE.sigstore.json"

      - name: Upload release candidate
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alias-sdk-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30

      - name: Summarize candidate
        env:
          ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          KEYLESS_ATTESTED: ${{ github.event_name != 'pull_request' }}
        run: |
          {
            echo "# Alias SDK release candidate"
            echo
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
            echo "- Package version: \`$(scripts/alias-sdk/read-release-version.sh)\`"
            echo "- Alias reference schema: \`1\`"
            echo "- Workflow artifact ID: \`$ARTIFACT_ID\`"
            echo "- Workflow artifact SHA-256: \`$ARTIFACT_DIGEST\`"
            echo "- Keyless file attestations: \`$KEYLESS_ATTESTED\`"
            echo "- Registry publication: disabled"
            echo
            echo "The candidate contains the handoff manifest, per-file SHA-256 hashes, API reports, reproducibility evidence, a CycloneDX SBOM, dependency audit evidence, source pins, and client integration steps."
          } >>"$GITHUB_STEP_SUMMARY"
